# /usr/lib/systemd/system/mosquitto.service.d/openwood-docker0.conf
#
# Shipped by openwood so that a `listener 1883 172.17.0.1` line in
# /etc/mosquitto/mosquitto.conf (used to let bridged docker containers,
# e.g. Home Assistant, reach the host broker) cannot kill mosquitto at
# boot: docker0 only exists once docker is up, and without this ordering
# the broker dies five times in a row with "Cannot assign requested
# address" and systemd gives up (start-limit-hit).
#
# Harmless on machines without docker or without that listener line;
# delete this file if you do not want the ordering.
[Unit]
After=docker.service
Wants=docker.service
